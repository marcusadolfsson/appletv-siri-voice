press:
  name: Press button
  description: >-
    Send a remote button to the active Apple TV over HomeKit. This is
    independent of pyatv, so it keeps working when the Apple TV integration's
    connection is asleep or wedged.
  fields:
    button:
      name: Button
      required: true
      example: TV_HOME
      selector:
        select:
          options: [MENU, PLAY_PAUSE, TV_HOME, SELECT, ARROW_UP, ARROW_RIGHT,
                    ARROW_DOWN, ARROW_LEFT, VOLUME_UP, VOLUME_DOWN, SIRI, POWER, GENERIC]
    target:
      name: Apple TV
      description: >-
        Which Apple TV. Required — there is no default, so a command always says
        where it is going. Identifiers are listed on sensor.apple_tv_bridge.
      required: true
      example: 207551296
      selector:
        number: {mode: box, min: 0, max: 4294967295}


recover:
  name: Recover voice
  description: >-
    Force the Apple TV to reopen its HomeKit data stream, which is what carries
    Siri audio. The bridge does this automatically at startup and when it
    notices the stream is gone; this is the manual override. Takes about a
    minute, during which buttons briefly drop out twice.

say:
  name: Say to Siri
  description: >-
    Speak text to Siri on the Apple TV. Home Assistant synthesises the words and
    streams them in as if they had been spoken — so automations and scripts can
    issue Siri commands without a microphone.
  fields:
    text:
      name: Text
      description: What to say to Siri.
      required: true
      example: Play the next episode
      selector:
        text:
    target:
      name: Apple TV
      description: >-
        Which Apple TV. Required — there is no default, so a command always says
        where it is going. Identifiers are listed on sensor.apple_tv_bridge.
      required: true
      example: 207551296
      selector:
        number:
          mode: box
          min: 0
          max: 4294967295
