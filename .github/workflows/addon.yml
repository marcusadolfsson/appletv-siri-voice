name: Add-on

on:
  push:
    paths: ["appletv_siri_bridge/**", "bridge/**", "LICENSE", "NOTICE", "THIRD_PARTY.md", "repository.yaml", ".github/workflows/addon.yml"]
  pull_request:
    paths: ["appletv_siri_bridge/**", "bridge/**", "LICENSE", "NOTICE", "THIRD_PARTY.md", "repository.yaml", ".github/workflows/addon.yml"]
  workflow_dispatch:

jobs:
  lint:
    name: Lint config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Validates config.yaml against Supervisor's real schema. This is most of
      # what can be checked without a Supervisor to install into.
      - uses: frenck/action-addon-linter@v2
        with:
          path: "./appletv_siri_bridge"

  # The add-on folder carries its own copies of the bridge and the licence
  # files, because Supervisor builds with that folder as the context and cannot
  # reach anything outside it. The container build (docker-compose, hap-remote)
  # still builds from bridge/. Two copies of index.js drift silently -- the
  # add-on would keep running the old bridge with nothing to say so -- so this
  # fails the moment they differ.
  copies:
    name: Add-on copies match their sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        run: |
          fail=0
          for pair in \
              bridge/index.js:appletv_siri_bridge/index.js \
              bridge/package.json:appletv_siri_bridge/package.json \
              LICENSE:appletv_siri_bridge/LICENSE \
              NOTICE:appletv_siri_bridge/NOTICE \
              THIRD_PARTY.md:appletv_siri_bridge/THIRD_PARTY.md; do
            src=${pair%%:*}; dst=${pair##*:}
            if ! cmp -s "$src" "$dst"; then
              echo "::error file=$dst::$dst differs from $src -- run: cp $src $dst"
              fail=1
            fi
          done
          exit $fail

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `platform` is NOT optional. Without it build-push-action builds for
          # the RUNNER's platform (amd64) whatever base image it is handed, and
          # the two failure modes hide each other: aarch64-base is a proper OCI
          # index declaring only linux/arm64, so the build correctly fails with
          # no matching manifest -- while armv7-base is a legacy single manifest
          # that Docker pulls regardless of platform, so that job went GREEN
          # without having emulated anything. One honest failure, one dishonest
          # pass, same root cause.
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # Build only -- no push. With no native dependencies (opusscript is
      # WASM/JS, not a binding) a successful build on every arch is most of what
      # "supports this architecture" means here.
      - name: Resolve base image
        id: base
        run: |
          BASE=$(python3 -c "import yaml;print(yaml.safe_load(open('appletv_siri_bridge/build.yaml'))['build_from']['${{ matrix.arch }}'])")
          echo "image=$BASE" >> "$GITHUB_OUTPUT"
      - name: Build
        uses: docker/build-push-action@v6
        with:
          # The add-on folder, NOT the repo root -- that is what Supervisor
          # uses. With `context: .` this job built fine while every real
          # install failed on COPY paths that only resolve from the root: CI
          # was testing a build nobody runs.
          context: appletv_siri_bridge
          file: appletv_siri_bridge/Dockerfile
          build-args: BUILD_FROM=${{ steps.base.outputs.image }}
          platforms: ${{ matrix.platform }}
          push: false
