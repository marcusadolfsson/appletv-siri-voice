name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"   # catch breakage from upstream HA/HACS changes
  workflow_dispatch:

jobs:
  hassfest:
    name: Home Assistant manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
